<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #16181c; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" environment-image="neutral"></model-viewer>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('src');
    if (src) document.getElementById('viewer').src = src;
  </script>
</body>
</html>
