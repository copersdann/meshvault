[project]
name = "meshvault-server"
version = "0.1.0"
description = "MeshVault - self-hosted 3D model library and print manager"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "trimesh>=4.4",
    "numpy>=1.26",
    "networkx>=3.0",
    "lxml>=5.0",
    "pillow>=10.4",
    "cryptography>=43",
]

[project.optional-dependencies]
cad = ["cadquery>=2.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Не пишем .pytest_cache (на Windows каталог может быть недоступен, WinError 5).
# Корень временных файлов задаём в conftest.py: путь без кириллицы нужен FreeCADCmd.
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
